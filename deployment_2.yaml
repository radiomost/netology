apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-delayed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-delayed
  template:
    metadata:
      labels:
        app: nginx-delayed
    spec:
      initContainers:
        - name: wait-for-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Service DNS..."
              until nslookup nginx-svc.default.svc.cluster.local; do
                sleep 2
              done
              echo "Service DNS is available"

      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80