apiVersion: apps/v1
kind: Deployment
metadata:
  name: netology-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netology-app
  template:
    metadata:
      labels:
        app: netology-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80

        - name: multitool
          image: praqma/network-multitool
          command: ["sh", "-c", "while true; do sleep 3600; done"]