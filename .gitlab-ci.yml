stages:
  - validate
  - plan
  - apply

variables:
  TF_VERSION: "1.5.0"
  YC_CLI_VERSION: "0.129.0"

# Базовый образ с Terraform и Yandex Cloud CLI
.base:
  image: hashicorp/terraform:${TF_VERSION}
  before_script:
    - apk add --no-cache curl jq bash python3
    - curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
    - export PATH="$PATH:$HOME/yandex-cloud/bin"
    - yc config profile create ci-profile || true
    - echo "Authenticating to Vault..."
    - export VAULT_TOKEN=$(curl -s --request POST --data "{\"role_id\":\"$VAULT_ROLE_ID\",\"secret_id\":\"$VAULT_SECRET_ID\"}" $VAULT_ADDR/v1/auth/approle/login | jq -r '.auth.client_token')
    - export SA_KEY=$(curl -s --header "X-Vault-Token: $VAULT_TOKEN" $VAULT_ADDR/v1/secret/data/yc/diploma-sa | jq -r '.data.data.sa_key')
    - echo "$SA_KEY" > ~/.authorized_key.json
    - yc config set service-account-key ~/.authorized_key.json
    - yc config set folder-id "$TF_VAR_folder_id"

validate:
  extends: .base
  stage: validate
  script:
    - echo "Validating Terraform configurations..."
    - |
      for dir in stage0-bootstrap stage1-network stage2-compute stage3-registry; do
        if [ -d "$dir" ]; then
          echo ">>> Validating $dir"
          cd "$dir"
          terraform init -backend=false
          terraform validate
          cd ..
        fi
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

plan:
  extends: .base
  stage: plan
  script:
    - echo "Creating Terraform plan..."
    - |
      for dir in stage0-bootstrap stage1-network stage2-compute stage3-registry; do
        if [ -d "$dir" ]; then
          echo ">>> Planning $dir"
          cd "$dir"
          terraform init
          terraform plan -out=tfplan
          cd ..
        fi
      done
  artifacts:
    paths:
      - stage*/tfplan
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

apply:
  extends: .base
  stage: apply
  script:
    - echo "Applying Terraform changes..."
    - |
      for dir in stage0-bootstrap stage1-network stage2-compute stage3-registry; do
        if [ -d "$dir" ] && [ -f "$dir/tfplan" ]; then
          echo ">>> Applying $dir"
          cd "$dir"
          terraform apply -auto-approve tfplan
          cd ..
        fi
      done
  dependencies:
    - plan
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual  # Ручное подтверждение apply