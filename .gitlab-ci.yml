stages:
  - plan
  - apply
  - deploy_k8s

variables:
  TF_VERSION: "1.5.0"

# Базовый шаблон для всех джоб
.base:
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""] # Отключаем дефолтный entrypoint "terraform"
  before_script:
    # 1. Устанавливаем утилиты. Добавили 'openssl' и 'helm' в этот список!
    - apk add --no-cache curl jq bash python3 git make openssh-client sed openssl helm
    
    # 2. Устанавливаем Yandex Cloud CLI
    - curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
    - export PATH="$PATH:$HOME/yandex-cloud/bin"
    
    # 3. Настраиваем аутентификацию YC из переменной GitLab
    - echo "$YC_SA_KEY" > ~/.authorized_key.json
    - chmod 600 ~/.authorized_key.json
    - yc config profile create ci-profile || true
    - yc config set service-account-key ~/.authorized_key.json
    - yc config set folder-id "$TF_VAR_folder_id"
    
    # 4. Устанавливаем kubectl (Helm уже установлен выше через apk)
    - curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
    - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
    - rm -f kubectl # Очищаем временный файл

# Стадия 1: Планирование (запускается автоматически при любом пуше)
plan:
  extends: .base
  stage: plan
  script:
    - echo "Running make plan..."
    - make plan
  rules:
    - if: '$CI_COMMIT_BRANCH'

# Стадия 2: Применение инфраструктуры (требует ручного подтверждения)
apply:
  extends: .base
  stage: apply
  script:
    - echo "Running make apply..."
    - make apply
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: manual

# Стадия 3: Деплой в Kubernetes (требует ручного подтверждения)
deploy_k8s:
  extends: .base
  stage: deploy_k8s
  before_script:
    - !reference [.base, before_script]
    # Настраиваем SSH-ключ для подключения к master-ноде (нужен для make k8s-kubeconfig)
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    # Отключаем строгую проверку хостов для первого подключения
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - echo "Fetching kubeconfig from master node..."
    - make k8s-kubeconfig
    - echo "Deploying monitoring stack and application..."
    - make k8s-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: manual