stages:
  - validate
  - plan
  - apply
  - kubespray
  - APP
  - k8s

variables:
  TF_BINARY_URL: "https://repository.rdmost.ru/repository/registry_terraform/terraform/terraform_1.14.0_linux_amd64.zip"
  YC_PROVIDER_URL: "https://repository.rdmost.ru/repository/registry_terraform/provider/yandex/terraform-provider-yandex_0.129.0_linux_amd64.zip"
  DEFAULT_BRANCH: "diplom-dev"
  S3_BACKET: netology-stg

# ==============================================================================
# 1. YAML-ЯКОРЬ (ANCHOR) для базовых шагов установки
# ==============================================================================
.base_before_script: &base_before_script
  - echo "Configuring AWS credentials for Terraform backend..."
  - export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}"
  - export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}"
  - export AWS_DEFAULT_REGION="us-east-1"
  - apk add --no-cache curl unzip jq bash python3 git make openssh-client sed openssl helm
  - echo "Installing custom Terraform 1.14.0..."
  - curl -k -sSL "$TF_BINARY_URL" -o /tmp/terraform.zip
  - unzip -o /tmp/terraform.zip -d /usr/local/bin/
  - rm -f /tmp/terraform.zip
  - terraform version
  - echo "Installing custom Yandex Provider 0.129.0..."
  - mkdir -p ~/.terraform.d/plugins/registry.terraform.io/yandex-cloud/yandex/0.129.0/linux_amd64
  - curl -k -sSL "$YC_PROVIDER_URL" -o /tmp/yandex-provider.zip
  - unzip -o /tmp/yandex-provider.zip -d ~/.terraform.d/plugins/registry.terraform.io/yandex-cloud/yandex/0.129.0/linux_amd64/
  - rm -f /tmp/yandex-provider.zip
  # ИСПРАВЛЕНО: Однострочный echo вместо многострочного heredoc, чтобы избежать ошибок парсинга YAML
  - echo 'provider_installation { filesystem_mirror { path = "/root/.terraform.d/plugins" include = ["registry.terraform.io/yandex-cloud/yandex"] } direct { exclude = ["registry.terraform.io/yandex-cloud/yandex"] } }' > ~/.terraformrc
  - curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
  - export PATH="$PATH:$HOME/yandex-cloud/bin"
  - echo "$YC_SA_KEY" > ~/.authorized_key.json
  - chmod 600 ~/.authorized_key.json
  - yc config profile create ci-profile || true
  - yc config set service-account-key ~/.authorized_key.json
  - yc config set folder-id "$TF_VAR_folder_id"
  - curl -sLO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
  - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
  - rm -f kubectl

# Базовый шаблон, использующий якорь
.base:
  image: alpine:3.18
  before_script: *base_before_script

# ==============================================================================
# TERRAFORM CI/CD PIPELINE (требование диплома)
# ==============================================================================

# --- Валидация синтаксиса Terraform ---
tf-validate:
  extends: .base
  stage: validate
  script:
    - echo "=== Validating all Terraform stages ==="
    - |
      for stage in stage0-bootstrap stage1-network stage2-compute stage3-registry; do
        if [ -d "$stage" ]; then
          echo "--- Validating $stage ---"
          cd "$stage"
          terraform init -backend=false -input=false
          terraform validate
          terraform fmt -check -diff || true
          cd ..
        fi
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'



# --- Plan: запускается на каждый MR, результат публикуется в MR ---
plan-stage0:
  extends: .base
  stage: plan
  script:
    - echo "=== НАЧАЛО TERRAFORM PLAN SATGE0-BOOTSTRAP ==="
    - export TF_DIR="stage0-bootstrap"
    - terraform -chdir=$TF_DIR init -input=false -reconfigure -backend-config="bucket=${S3_BACKET}"
    - terraform -chdir=$TF_DIR plan -out=tfplan.binary -input=false
    - terraform -chdir=$TF_DIR show -no-color tfplan.binary > plan.txt
    - echo "=== TERRAFORM PLAN OUTPUT ==="
    - cat plan.txt
    - echo "============================="
  artifacts:
    name: "tfplan-stage0-$CI_COMMIT_REF_SLUG"
    paths:
      - stage0-bootstrap/tfplan.binary
      - stage0-bootstrap/plan.txt
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == $DEFAULT_BRANCH'

plan-stage1:
  extends: .base
  stage: plan
  # needs:
  #   - job: apply-stage0
  #     optional: true
  script:
    - echo "=== НАЧАЛО TERRAFORM PLAN SATGE1-NETWORK ==="
    - export TF_DIR="stage1-network"
    - terraform -chdir=$TF_DIR init -input=false -reconfigure -backend-config="bucket=${S3_BACKET}"
    - terraform -chdir=$TF_DIR plan -out=tfplan.binary -input=false
    - terraform -chdir=$TF_DIR show -no-color tfplan.binary > plan.txt
    - echo "=== TERRAFORM PLAN OUTPUT ==="
    - cat plan.txt
    - echo "============================="
  artifacts:
    name: "tfplan-stage1-$CI_COMMIT_REF_SLUG"
    paths:
      - stage1-network/tfplan.binary
      - stage1-network/plan.txt
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == $DEFAULT_BRANCH'

plan-stage2:
  extends: .base
  stage: plan
  # needs:
  #   - job: apply-stage1
  #     optional: true
  script:
    - echo "=== НАЧАЛО TERRAFORM PLAN SATGE2-COMPUTE ==="
    - export TF_DIR="stage2-compute"
    - terraform -chdir=$TF_DIR init -input=false -reconfigure -backend-config="bucket=${S3_BACKET}"
    - terraform -chdir=$TF_DIR plan -out=tfplan.binary -input=false
    - terraform -chdir=$TF_DIR show -no-color tfplan.binary > plan.txt
    - echo "=== TERRAFORM PLAN OUTPUT ==="
    - cat plan.txt
    - echo "============================="
  artifacts:
    name: "tfplan-stage2-$CI_COMMIT_REF_SLUG"
    paths:
      - stage2-compute/tfplan.binary
      - stage2-compute/plan.txt
    expire_in: 1 week
    reports:
      terraform: stage2-compute/plan.txt 
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == $DEFAULT_BRANCH'

plan-stage3:
  extends: .base
  stage: plan
  # needs:
  #   - job: apply-stage2
  #     optional: true
  script:
    - echo "=== НАЧАЛО TERRAFORM PLAN SATGE3-REGISTRY ==="
    - export TF_DIR="stage3-registry"
    - terraform -chdir=$TF_DIR init -input=false -reconfigure -backend-config="bucket=${S3_BACKET}"
    - terraform -chdir=$TF_DIR plan -out=tfplan.binary -input=false
    - terraform -chdir=$TF_DIR show -no-color tfplan.binary > plan.txt
    - echo "=== TERRAFORM PLAN OUTPUT ==="
    - cat plan.txt
    - echo "============================= "
  artifacts:
    name: "tfplan-stage3-$CI_COMMIT_REF_SLUG"
    paths:
      - stage3-registry/tfplan.binary
      - stage3-registry/plan.txt
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == $DEFAULT_BRANCH'

# --- Apply: только после merge в main, ручной запуск ---
apply-stage0:
  extends: .base
  stage: apply
  needs: 
    - job: plan-stage0
      optional: true
  
  script:
    - echo "=== ПРИМЕНЕНИЕ ПЛАНА ДЛЯ STAGE0-BOOTSTRAP ==="
    - export TF_DIR="stage0-bootstrap"
    - terraform -chdir=$TF_DIR init -input=false -backend=false
    - terraform -chdir=$TF_DIR apply -input=false -auto-approve tfplan.binary
    - echo "=== STAGE1-NETWORK УСПЕШНО ПРИМЕНЕН ==="
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEFAULT_BRANCH'
      when: manual

apply-stage1:
  extends: .base
  stage: apply
  needs:
    - job: plan-stage1
      optional: true
  script:
    - echo "=== ПРИМЕНЕНИЕ ПЛАНА ДЛЯ STAGE1-NETWORK ==="
    - export TF_DIR="stage1-network"
    - terraform -chdir=$TF_DIR init -input=false -backend=false
    - terraform -chdir=$TF_DIR apply -input=false -auto-approve tfplan.binary
    - echo "=== STAGE1-NETWORK УСПЕШНО ПРИМЕНЕН ==="
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEFAULT_BRANCH'
      when: manual

apply-stage2:
  extends: .base
  stage: apply
  needs: 
    - job: plan-stage2
      optional: true
  script:
    - echo "=== ПРИМЕНЕНИЕ ПЛАНА ДЛЯ STAGE2-COMPUTE ==="
    - export TF_DIR="stage2-compute"
    - terraform -chdir=$TF_DIR init -input=false -backend=false
    - terraform -chdir=$TF_DIR apply -input=false -auto-approve tfplan.binary
    - echo "=== STAGE2-COMPUTE УСПЕШНО ПРИМЕНЕН ==="
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEFAULT_BRANCH'
      when: manual

apply-stage3:
  extends: .base
  stage: apply
  needs:
    - job: plan-stage3
      optional: true
  script:
    - echo "=== ПРИМЕНЕНИЕ ПЛАНА ДЛЯ STAGE3-REGISTRY ==="
    - export TF_DIR="stage3-registry"
    - terraform -chdir=$TF_DIR init -input=false -backend=false
    - terraform -chdir=$TF_DIR apply -input=false -auto-approve tfplan.binary
    - echo "=== STAGE3-REGISTRY УСПЕШНО ПРИМЕНЕН ==="
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEFAULT_BRANCH'
      when: manual

kubespray-deploy-cluster:
  extends: .base
  stage: kubespray
  needs:
    - job: apply-stage0
    - job: apply-stage1
    - job: apply-stage2
    - job: apply-stage3
      optional: true
  script:
    - echo "=== ШАГ 1 Инициализация Kubespray ==="
    - make kubespray-init
    
    - echo "=== ШАГ 2 Генерация инвентаря Ansible ==="
    - make kubespray-inventory
    
    - echo "=== ШАГ 3 Деплой Kubernetes кластера ==="
    - make kubespray-deploy
    
    - echo "=== ✅ KUBESPRAY УСПЕШНО ЗАВЕРШЕН ==="
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEFAULT_BRANCH'

build-docker-app:
  extends: .base
  stage: APP
  needs:
    - job: kubespray-deploy-cluster
      optional: true
  script:
    - echo "=== СБОРКА DOCKER ОБРАЗА ПРИЛОЖЕНИЯ ==="
    - make build
    - echo "=== СБОРКА DOCKER ОБРАЗА ПРИЛОЖЕНИЯ ЗАВЕРШЕНА ==="
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEFAULT_BRANCH'

deploy-app-to-k8s:
  extends: .base
  stage: k8s
  needs:
    - job: kubespray-deploy-cluster # Или kubespray-deploy, если выбрали Вариант 2
    - job: build-docker-app
  before_script:
    - !reference [.base, before_script]
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - sed -i 's/\r$//' ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null" > ~/.ssh/config
  script:
    - echo "=== 1. Подключение к кластеру (k8s-setup) ==="
    - make k8s-setup # (или make k8s-ci-connect, в зависимости от того, как у вас называется таргет)
    
    - echo "=== 2. Деплой приложения и мониторинга ==="
    - make k8s-deploy
    
    - echo "=== ✅ ПРИЛОЖЕНИЕ УСПЕШНО ЗАДЕПЛОЕНО ==="
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEFAULT_BRANCH'
