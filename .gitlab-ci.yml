stages:
  - plan
  - apply
variables:
  TF_BINARY_URL: "https://repository.rdmost.ru/repository/registry_terraform/terraform/terraform_1.14.0_linux_amd64.zip"
  YC_PROVIDER_URL: "https://repository.rdmost.ru/repository/registry_terraform/provider/yandex/terraform-provider-yandex_0.129.0_linux_amd64.zip"
  DEFAULT_BRANCH: "diplom-dev"
  S3_BACKET: netology-stg

# ==============================================================================
# 1. YAML-ЯКОРЬ (ANCHOR) для базовых шагов установки
# ==============================================================================
.base_before_script: &base_before_script
  - echo "Configuring AWS credentials for Terraform backend..."
  - export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}"
  - export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}"
  - export AWS_DEFAULT_REGION="us-east-1"
  - apk add --no-cache curl unzip jq bash python3 git make openssh-client sed openssl helm
  - echo "Installing custom Terraform 1.14.0..."
  - curl -k -sSL "$TF_BINARY_URL" -o /tmp/terraform.zip
  - unzip -o /tmp/terraform.zip -d /usr/local/bin/
  - rm -f /tmp/terraform.zip
  - terraform version
  - echo "Installing custom Yandex Provider 0.129.0..."
  - mkdir -p ~/.terraform.d/plugins/registry.terraform.io/yandex-cloud/yandex/0.129.0/linux_amd64
  - curl -k -sSL "$YC_PROVIDER_URL" -o /tmp/yandex-provider.zip
  - unzip -o /tmp/yandex-provider.zip -d ~/.terraform.d/plugins/registry.terraform.io/yandex-cloud/yandex/0.129.0/linux_amd64/
  - rm -f /tmp/yandex-provider.zip
  # ИСПРАВЛЕНО: Однострочный echo вместо многострочного heredoc, чтобы избежать ошибок парсинга YAML
  - echo 'provider_installation { filesystem_mirror { path = "/root/.terraform.d/plugins" include = ["registry.terraform.io/yandex-cloud/yandex"] } direct { exclude = ["registry.terraform.io/yandex-cloud/yandex"] } }' > ~/.terraformrc
  - curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
  - export PATH="$PATH:$HOME/yandex-cloud/bin"
  - echo "$YC_SA_KEY" > ~/.authorized_key.json
  - chmod 600 ~/.authorized_key.json
  - yc config profile create ci-profile || true
  - yc config set service-account-key ~/.authorized_key.json
  - yc config set folder-id "$TF_VAR_folder_id"
  - curl -sLO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
  - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
  - rm -f kubectl

# Базовый шаблон, использующий якорь
.base:
  image: alpine:3.18
  before_script: *base_before_script

################ PLAN ##############
debug:
  extends: .base
  stage: plan
  script:
    - echo 'Запуск тестового скрипта...'
    - echo 'Текущая ветка:' $CI_COMMIT_BRANCH
    - echo 'Источник пайплайна:' $CI_PIPELINE_SOURCE
    - echo "Проверка переменных (должны быть пустыми или содержать значения из GitLab):"
    - echo TF_VAR_folder_id = ${TF_VAR_folder_id:-НЕ ЗАДАН}
  rules:
    - when: always

plan-stage0:
  extends: .base
  stage: plan
  script:
    - echo "=== НАЧАЛО TERRAFORM PLAN SATGE0-BOOTSTRAP ==="
    - export TF_DIR="stage0-bootstrap"
    - terraform -chdir=$TF_DIR init -input=false -reconfigure -backend-config="bucket=${S3_BACKET}"
    - terraform -chdir=$TF_DIR plan -out=tfplan.binary -input=false
    - terraform -chdir=$TF_DIR show -no-color tfplan.binary > plan.txt
    - echo "=== TERRAFORM PLAN OUTPUT ==="
    - cat plan.txt
    - echo "============================="
  rules:
    - when: always

plan-stage1:
  extends: .base
  stage: plan
  needs: ["plan-stage0"]
  script:
    - echo "=== НАЧАЛО TERRAFORM PLAN SATGE1-NETWORK ==="
    - export TF_DIR="stage1-network"
    - terraform -chdir=$TF_DIR init -input=false -reconfigure -backend-config="bucket=${S3_BACKET}"
    - terraform -chdir=$TF_DIR plan -out=tfplan.binary -input=false
    - terraform -chdir=$TF_DIR show -no-color tfplan.binary > plan.txt
    - echo "=== TERRAFORM PLAN OUTPUT ==="
    - cat plan.txt
    - echo "============================="
  artifacts:
    name: "tfplan-stage1-$CI_COMMIT_REF_SLUG"
    paths:
      - stage1-network/tfplan.binary
      - stage1-network/plan.txt
    expire_in: 1 week
  rules:
    - when: always

apply-stage1:
  extends: .base
  stage: apply
  needs: ["plan-stage1"]
  script:
    - echo "=== ПРИМЕНЕНИЕ ПЛАНА ДЛЯ STAGE1-NETWORK ==="
    - export TF_DIR="stage1-network"
    - terraform -chdir=$TF_DIR init -input=false -backend=false
    - terraform -chdir=$TF_DIR apply -input=false -auto-approve tfplan.binary
    - echo "=== STAGE1-NETWORK УСПЕШНО ПРИМЕНЕН ==="
  rules:
    - when: always

plan-stage2:
  extends: .base
  stage: plan
  needs: ["apply-stage1"]
  script:
    - echo "=== НАЧАЛО TERRAFORM PLAN SATGE2-COMPUTE ==="
    - export TF_DIR="stage2-compute"
    - terraform -chdir=$TF_DIR init -input=false -reconfigure -backend-config="bucket=${S3_BACKET}"
    - terraform -chdir=$TF_DIR plan -out=tfplan.binary -input=false
    - terraform -chdir=$TF_DIR show -no-color tfplan.binary > plan.txt
    - echo "=== TERRAFORM PLAN OUTPUT ==="
    - cat plan.txt
    - echo "============================="
  rules:
    - when: always

plan-stage3:
  extends: .base
  stage: plan
  needs: ["plan-stage2"]
  script:
    - echo "=== НАЧАЛО TERRAFORM PLAN SATGE3-REGISTRY ==="
    - export TF_DIR="stage3-registry"
    - terraform -chdir=$TF_DIR init -input=false -reconfigure -backend-config="bucket=${S3_BACKET}"
    - terraform -chdir=$TF_DIR plan -out=tfplan.binary -input=false
    - terraform -chdir=$TF_DIR show -no-color tfplan.binary > plan.txt
    - echo "=== TERRAFORM PLAN OUTPUT ==="
    - cat plan.txt
    - echo "============================="
  rules:
    - when: always

apply-all:
  extends: .base
  stage: apply
  needs:
    - plan-stage0
    - plan-stage1
    - plan-stage2
    - plan-stage3 
  script:
    - echo "Running make apply..."
    - make -f Makefile.ci apply
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEFAULT_BRANCH'
      when: manual