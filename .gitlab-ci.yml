stages:
  - validate
  - plan
  - apply

variables:
  TF_VERSION: "1.5.0"

# Базовый образ с Terraform
.base:
  image: hashicorp/terraform:${TF_VERSION}
  before_script:
    - apk add --no-cache curl jq bash python3 git
    
    # Установка Yandex Cloud CLI
    - curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
    - export PATH="$PATH:$HOME/yandex-cloud/bin"
    
    # Создание ключа сервисного аккаунта из переменной GitLab
    - echo "Creating YC Service Account key from GitLab variable..."
    - echo "$YC_SA_KEY" > ~/.authorized_key.json
    - chmod 600 ~/.authorized_key.json
    
    # Настройка профиля YC CLI
    - yc config profile create ci-profile || true
    - yc config set service-account-key ~/.authorized_key.json
    - yc config set folder-id "$TF_VAR_folder_id"
    
    # Проверка аутентификации
    - yc config list

validate:
  extends: .base
  stage: validate
  script:
    - echo "Validating Terraform configurations..."
    - |
      for dir in stage0-bootstrap stage1-network stage2-compute stage3-registry; do
        if [ -d "$dir" ]; then
          echo ">>> Validating $dir"
          cd "$dir"
          terraform init -backend=false
          terraform validate
          cd ..
        fi
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

plan:
  extends: .base
  stage: plan
  script:
    - echo "Creating Terraform plan..."
    - |
      for dir in stage0-bootstrap stage1-network stage2-compute stage3-registry; do
        if [ -d "$dir" ]; then
          echo ">>> Planning $dir"
          cd "$dir"
          terraform init
          terraform plan -out=tfplan
          cd ..
        fi
      done
  artifacts:
    paths:
      - stage*/tfplan
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

apply:
  extends: .base
  stage: apply
  script:
    - echo "Applying Terraform changes..."
    - |
      for dir in stage0-bootstrap stage1-network stage2-compute stage3-registry; do
        if [ -d "$dir" ] && [ -f "$dir/tfplan" ]; then
          echo ">>> Applying $dir"
          cd "$dir"
          terraform apply -auto-approve tfplan
          cd ..
        fi
      done
  dependencies:
    - plan
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual  # Ручное подтверждение apply