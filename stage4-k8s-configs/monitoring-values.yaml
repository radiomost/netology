# stage4-k8s-configs/monitoring-values.yaml

# Optimization for budget: minimal resources for monitoring stack
prometheus:
  prometheusSpec:
    resources:
      requests:
        memory: 400Mi
        cpu: 100m
      limits:
        memory: 800Mi
        cpu: 500m
    retention: 3d # Keep data for 3 days to save disk space

grafana:
  adminPassword: "prom-operator"  # Явно задаем пароль
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m
  # Enable ingress for Grafana on port 80
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.diploma.local # Will be accessed via IP + Host header or /grafana path
    paths:
      - /
    pathType: Prefix

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 50Mi
        cpu: 10m
      limits:
        memory: 100Mi
        cpu: 50m

# Node exporter is deployed as a DaemonSet, limit its resources too
prometheus-node-exporter:
  resources:
    requests:
      memory: 30Mi
      cpu: 10m
    limits:
      memory: 50Mi
      cpu: 50m