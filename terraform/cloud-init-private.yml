#cloud-config

datasource:
  Ec2:
    strict_id: false
ssh_pwauth: yes
users:
  - name: user
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII/VZ5ar2TJiCLovknC7hg8Mg0Q8hJU9EZA+6j2jb5Rf root@h-devops
write_files:
  - path: "/etc/netplan/01-netcfg.yaml"
    permissions: "0644"
    content: |
      # This file describes the network interfaces available on your system
      # For more information, see netplan(5).
      network:
        version: 2
        renderer: networkd
        ethernets:
          eth0:
            dhcp4: yes
          # eth1:
          #   dhcp4: yes
          #   dhcp4-overrides:
          #     use-dns: false
          #     use-routes: false
          #   dhcp6: no
          # eth2:
          #   dhcp4: yes
          #   dhcp4-overrides:
          #     use-dns: false
          #     use-routes: false
          #   dhcp6: no
runcmd:
  - sleep 1
  - sudo -i
  - netplan apply